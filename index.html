<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>body { margin: 0; overflow: hidden; }</style>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
      <a-assets>
        <!-- Archivo del modelo 3D -->
        <a-asset-item id="kneeModel" src="./knee_anatomy.glb"></a-asset-item>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- position: X=-0, Y=-0.8 (más abajo), Z=0.02 (pegado a la portada) -->
        <a-gltf-model src="#kneeModel" position="0 -0.5 -0.5" scale="10 10 10" rotation="0 -90 0"></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
